server:
  port: 8761

spring:
  application:
    name: discovery-server

# Actuator 配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false

