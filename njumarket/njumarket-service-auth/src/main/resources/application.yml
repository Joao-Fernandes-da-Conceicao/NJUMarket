server:
  port: 8091

spring:
  application:
    name: njumarket-service-auth
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${AUTH_DATASOURCE_URL:jdbc:mysql://localhost:3306/nju_market?useSSL=false&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
    username: ${AUTH_DATASOURCE_USERNAME:root}
    password: ${AUTH_DATASOURCE_PASSWORD:Hqz20050316}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:hqz20050316}
      database: ${AUTH_REDIS_DATABASE:2}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

# Feign Client 配置
feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 10000
  compression:
    request:
      enabled: true
    response:
      enabled: true

# Actuator 配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true

# 日志配置
logging:
  level:
    com.njumarket.auth.controller: INFO
    com.njumarket.auth.service: INFO
    com.njumarket.auth.filter: INFO
    com.njumarket.njumarket.resolver: INFO

