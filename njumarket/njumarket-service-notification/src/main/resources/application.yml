# Notification Service 本地配置（简化版）
# 详细配置已迁移到 Config Server: config-repo/njumarket-service-notification.yml
# 本地仅保留必要的服务标识和 Config Server 连接配置

server:
  port: 8097

spring:
  application:
    name: njumarket-service-notification
  cloud:
    config:
      enabled: ${CONFIG_SERVER_ENABLED:false}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:default}
      password: ${REDIS_PASSWORD:hqz20050316}
      database: ${NOTIFICATION_REDIS_DATABASE:7}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:admin}
    password: ${RABBITMQ_PASSWORD:admin}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

