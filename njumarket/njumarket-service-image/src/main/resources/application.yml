server:
  port: 8095

spring:
  application:
    name: njumarket-service-image
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${IMAGE_DATASOURCE_URL:jdbc:mysql://localhost:3306/nju_market?useSSL=false&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
    username: ${IMAGE_DATASOURCE_USERNAME:root}
    password: ${IMAGE_DATASOURCE_PASSWORD:Hqz20050316}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

# Actuator 配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
  health:
    redis:
      enabled: false  # image-service 不使用 Redis，禁用 Redis 健康检查
  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true

app:
  upload:
    avatar-path: ${AVATAR_UPLOAD_PATH:uploads/avatars}
    commodity-path: ${COMMODITY_UPLOAD_PATH:uploads/commodities}
  image:
    base-url: ${IMAGE_BASE_URL:http://localhost:8080}

