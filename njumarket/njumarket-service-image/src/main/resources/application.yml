# Image Service 本地配置（简化版）
# 详细配置已迁移到 Config Server: config-repo/njumarket-service-image.yml
# 本地仅保留必要的服务标识和 Config Server 连接配置

server:
  port: 8095

spring:
  application:
    name: njumarket-service-image
  cloud:
    config:
      enabled: ${CONFIG_SERVER_ENABLED:false}

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${IMAGE_DATASOURCE_URL:jdbc:postgresql://localhost:5432/njumarket?currentSchema=nju_market}
    username: ${IMAGE_DATASOURCE_USERNAME:postgres}
    password: ${IMAGE_DATASOURCE_PASSWORD:Hqz20050316}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

