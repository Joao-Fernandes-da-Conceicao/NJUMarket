# AI Service 配置（从 Config Server 加载）
# 注意：MySQL 和 Redis 配置已移至 dev 环境配置文件（{application}-dev.yml）

server:
  port: 8098
  # 增加连接超时时间，支持 AI 对话等耗时操作
  connection-timeout: 120000  # 120 秒
  tomcat:
    connection-timeout: 120000  # 120 秒
    keep-alive-timeout: 120000  # 120 秒

spring:
  application:
    name: njumarket-service-ai
  # ✅ 显式启用 Feign Client 的 Micrometer 支持（确保追踪上下文正确传播）
  cloud:
    openfeign:
      micrometer:
        enabled: true

# Feign Client 配置
feign:
  circuitbreaker:
    enabled: true
  resilience4j:
    enabled: true
  client:
    config:
      default:
        connectTimeout: 10000  # AI服务调用其他服务时使用较长的超时时间
        readTimeout: 30000  # AI服务调用其他服务时使用较长的超时时间（支持AI对话等耗时操作）
      njumarket-service-commodity:
        connectTimeout: 5000
        readTimeout: 10000
        circuitbreaker:
          name: commodityService
      njumarket-service-auth:
        connectTimeout: 5000
        readTimeout: 10000
        circuitbreaker:
          name: authService
  compression:
    request:
      enabled: true
    response:
      enabled: true

# Actuator 配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,circuitbreakers,configprops,conditions
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      circuitbreakers:
        enabled: true
  health:
    rabbit:
      enabled: false  # AI服务暂不使用RabbitMQ，禁用健康检查
  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true
  tracing:
    enabled: true  # ✅ 启用追踪功能
    sampling:
      probability: 0.05  # 降低采样率，缓解 Zipkin 压力
    propagation:
      type: B3  # ✅ 使用 B3 传播格式（Zipkin 标准格式，确保追踪上下文正确传播）
  # ✅ 正确的配置路径：management.zipkin.tracing.endpoint（不是 management.tracing.export.zipkin.endpoint）
  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans
      connect-timeout: 10000  # 连接超时配置（毫秒）
      read-timeout: 10000  # 读取超时配置（毫秒）
  logging:
    level:
      com.njumarket.ai.client: DEBUG
      com.njumarket.ai.client.fallback: INFO
      com.njumarket.ai.service: INFO
      com.njumarket.ai.controller: INFO
      com.njumarket.njumarket.resolver: INFO
      io.github.resilience4j: DEBUG
      io.github.resilience4j.circuitbreaker: DEBUG

# Resilience4j 配置
resilience4j:
  circuitbreaker:
    instances:
      commodityService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        slowCallRateThreshold: 100
        slowCallDurationThreshold: 5s  # AI服务调用可能较慢，设置较长的慢调用阈值
      authService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        slowCallRateThreshold: 100
        slowCallDurationThreshold: 5s
  timelimiter:
    instances:
      commodityService:
        timeoutDuration: 10s  # AI服务调用其他服务时使用较长的超时时间
      authService:
        timeoutDuration: 10s

# 日志配置
logging:
  level:
    com.njumarket.ai.client: DEBUG
    com.njumarket.ai.client.fallback: INFO
    com.njumarket.ai.service: INFO
    com.njumarket.ai.controller: INFO
    com.njumarket.ai.vector: INFO
    com.njumarket.njumarket.resolver: INFO
    dev.langchain4j: INFO

njumarket:
  ai:
    milvus:
      enabled: ${MILVUS_ENABLED:true}
      uri: ${MILVUS_URI:http://milvus-standalone:19530}
      token: ${MILVUS_TOKEN:}
      db-name: ${MILVUS_DB_NAME:default}
      commodity-collection: ${MILVUS_COMMODITY_COLLECTION:commodity_vectors}
      user-profile-collection: ${MILVUS_USER_PROFILE_COLLECTION:user_profile_vectors}
      conversation-collection: ${MILVUS_CONVERSATION_COLLECTION:conversation_memory_vectors}
      dimension: ${MILVUS_DIMENSION:1024}
      top-k: ${MILVUS_TOP_K:10}
      metric-type: ${MILVUS_METRIC_TYPE:COSINE}
      memory-top-k: ${MILVUS_MEMORY_TOP_K:12}

