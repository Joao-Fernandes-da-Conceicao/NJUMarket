# Message Service - Dev 环境配置
# 包含 MySQL 和 Redis 等环境相关配置

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MESSAGE_DATASOURCE_URL:jdbc:mysql://localhost:3306/nju_market?useSSL=false&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
    username: ${MESSAGE_DATASOURCE_USERNAME:root}
    password: ${MESSAGE_DATASOURCE_PASSWORD:Hqz20050316}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:hqz20050316}
      database: ${MESSAGE_REDIS_DATABASE:2}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}

