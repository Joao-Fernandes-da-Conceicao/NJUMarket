# Message Service - Dev 环境配置
# 包含 PostgreSQL 和 Redis 等环境相关配置

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${MESSAGE_DATASOURCE_URL:jdbc:postgresql://localhost:5432/njumarket?currentSchema=nju_market}
    username: ${MESSAGE_DATASOURCE_USERNAME:postgres}
    password: ${MESSAGE_DATASOURCE_PASSWORD:Hqz20050316}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:hqz20050316}
      database: ${MESSAGE_REDIS_DATABASE:2}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}

