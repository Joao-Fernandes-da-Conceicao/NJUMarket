# Image Service - Dev 环境配置
# 包含 PostgreSQL 等环境相关配置

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${IMAGE_DATASOURCE_URL:jdbc:postgresql://localhost:5432/njumarket?currentSchema=nju_market}
    username: ${IMAGE_DATASOURCE_USERNAME:postgres}
    password: ${IMAGE_DATASOURCE_PASSWORD:Hqz20050316}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}

app:
  upload:
    avatar-path: ${AVATAR_UPLOAD_PATH:uploads/avatars}
    commodity-path: ${COMMODITY_UPLOAD_PATH:uploads/commodities}
  image:
    base-url: ${IMAGE_BASE_URL:http://localhost:8080}

