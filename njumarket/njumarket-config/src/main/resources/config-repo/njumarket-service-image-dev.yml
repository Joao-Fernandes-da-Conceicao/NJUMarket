# Image Service - Dev 环境配置
# 包含 MySQL 等环境相关配置

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${IMAGE_DATASOURCE_URL:jdbc:mysql://localhost:3306/nju_market?useSSL=false&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
    username: ${IMAGE_DATASOURCE_USERNAME:root}
    password: ${IMAGE_DATASOURCE_PASSWORD:Hqz20050316}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}

app:
  upload:
    avatar-path: ${AVATAR_UPLOAD_PATH:uploads/avatars}
    commodity-path: ${COMMODITY_UPLOAD_PATH:uploads/commodities}
  image:
    base-url: ${IMAGE_BASE_URL:http://localhost:8080}

