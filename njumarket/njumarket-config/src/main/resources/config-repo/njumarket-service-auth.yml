# Auth Service 配置（从 Config Server 加载）
# 注意：MySQL 和 Redis 配置已移至 dev 环境配置文件（{application}-dev.yml）

server:
  port: 8091

spring:
  application:
    name: njumarket-service-auth
  # ✅ 显式启用 Feign Client 的 Micrometer 支持（确保追踪上下文正确传播）
  cloud:
    openfeign:
      micrometer:
        enabled: true

# Feign Client 配置
feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 10000
  compression:
    request:
      enabled: true
    response:
      enabled: true

# Actuator 配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,configprops,conditions
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true
  tracing:
    enabled: true  # ✅ 启用追踪功能
    sampling:
      probability: 0.05  # 降低采样率，缓解 Zipkin 压力
    propagation:
      type: B3  # ✅ 使用 B3 传播格式（Zipkin 标准格式，确保追踪上下文正确传播）
  # ✅ 正确的配置路径：management.zipkin.tracing.endpoint（不是 management.tracing.export.zipkin.endpoint）
  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans
      connect-timeout: 10000  # 连接超时配置（毫秒）
      read-timeout: 10000  # 读取超时配置（毫秒）

# 日志配置
logging:
  level:
    com.njumarket.auth.controller: INFO
    com.njumarket.auth.service: INFO
    com.njumarket.auth.filter: INFO
    com.njumarket.njumarket.resolver: INFO

