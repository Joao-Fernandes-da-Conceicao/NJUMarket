# AI Service - Dev 环境配置
# 无关系库，仅 Redis + Milvus

spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:hqz20050316}
      database: ${AI_REDIS_DATABASE:3}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}

# LangChain4j 配置（用于 Doubao API，兼容 OpenAI 协议）
# 新版 Spring Boot Starter 要求 chat-model 为对象，不能为字符串
langchain4j:
  open-ai:
    api-key: ${DOUBAO_API_KEY:8736b46e-a38e-4d2c-8859-0460a1167310}
    base-url: ${DOUBAO_BASE_URL:https://ark.cn-beijing.volces.com/api/v3}
    timeout: 60s
    # 必须是对象结构，否则会报 ConverterNotFoundException: String -> ChatModelProperties
    chat-model:
      model-name: ${DOUBAO_CHAT_MODEL:doubao-seed-1-6-250615}
      temperature: 0.7
      max-tokens: 2000
    embedding-model:
      model-name: ${DOUBAO_EMBEDDING_MODEL:doubao-embedding-text-240715}

njumarket:
  ai:
    milvus:
      enabled: ${MILVUS_ENABLED:true}
      uri: ${MILVUS_URI:http://localhost:19530}
      token: ${MILVUS_TOKEN:}
      db-name: ${MILVUS_DB_NAME:default}
      commodity-collection: ${MILVUS_COMMODITY_COLLECTION:commodity_vectors}
      user-profile-collection: ${MILVUS_USER_PROFILE_COLLECTION:user_profile_vectors}
      conversation-collection: ${MILVUS_CONVERSATION_COLLECTION:conversation_memory_vectors}
      dimension: ${MILVUS_DIMENSION:1024}
      top-k: ${MILVUS_TOP_K:10}
      metric-type: ${MILVUS_METRIC_TYPE:COSINE}
      memory-top-k: ${MILVUS_MEMORY_TOP_K:12}

