# Commodity Service - Dev 环境配置
# 包含 PostgreSQL 和 Redis 等环境相关配置

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${COMMODITY_DATASOURCE_URL:jdbc:postgresql://localhost:5432/njumarket?currentSchema=nju_market}
    username: ${COMMODITY_DATASOURCE_USERNAME:postgres}
    password: ${COMMODITY_DATASOURCE_PASSWORD:Hqz20050316}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:hqz20050316}
      database: ${COMMODITY_REDIS_DATABASE:2}
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://elasticsearch:9200}
    username: ${ELASTICSEARCH_USERNAME:elastic}
    password: ${ELASTICSEARCH_PASSWORD:changeme}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}

commodity:
  search:
    enabled: ${COMMODITY_SEARCH_ENABLED:true}
    elasticsearch:
      enabled: ${COMMODITY_SEARCH_ES_ENABLED:true}
      highlight-enabled: ${COMMODITY_SEARCH_HIGHLIGHT:true}
      index: ${COMMODITY_SEARCH_INDEX:commodities}
    sync:
      auto-reindex-on-startup: ${COMMODITY_SEARCH_AUTO_REINDEX:false}
      page-size: ${COMMODITY_SEARCH_SYNC_PAGE_SIZE:200}

