# Notification Service 配置（从 Config Server 加载）
# 注意：Redis 配置已移至 dev 环境配置文件（{application}-dev.yml）

server:
  port: 8097

spring:
  application:
    name: njumarket-service-notification
  # ✅ 显式启用 Feign Client 的 Micrometer 支持（确保追踪上下文正确传播）
  cloud:
    openfeign:
      micrometer:
        enabled: true
  # RabbitMQ 配置
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:admin}
    password: ${RABBITMQ_PASSWORD:admin}
    virtual-host: /
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

# Feign Client 配置
feign:
  circuitbreaker:
    enabled: true
  resilience4j:
    enabled: true
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 10000
      njumarket-service-trade:
        connectTimeout: 3000
        readTimeout: 8000
        circuitbreaker:
          name: tradeService
      njumarket-service-auth:
        connectTimeout: 3000
        readTimeout: 5000
  compression:
    request:
      enabled: true
    response:
      enabled: true

# Actuator 配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,circuitbreakers,configprops,conditions
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      circuitbreakers:
        enabled: true
  info:
    env:
      enabled: true
    java:
      enabled: true
  os:
    enabled: true
  tracing:
    enabled: true  # ✅ 启用追踪功能
    sampling:
      probability: 0.05  # 降低采样率，缓解 Zipkin 压力
    propagation:
      type: B3  # ✅ 使用 B3 传播格式（Zipkin 标准格式，确保追踪上下文正确传播）
  # ✅ 正确的配置路径：management.zipkin.tracing.endpoint（不是 management.tracing.export.zipkin.endpoint）
  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans
      connect-timeout: 10000  # 连接超时配置（毫秒）
      read-timeout: 10000  # 读取超时配置（毫秒）
  logging:
    level:
      com.njumarket.notification.client: DEBUG
      com.njumarket.notification.client.fallback: INFO
      com.njumarket.notification.service: INFO
      com.njumarket.notification.filter: INFO
      com.njumarket.notification.controller: INFO
      io.github.resilience4j: DEBUG
      io.github.resilience4j.circuitbreaker: DEBUG
      # RabbitMQ 监听器日志
      org.springframework.amqp.rabbit.listener: INFO
      org.springframework.amqp.rabbit.listener.SimpleMessageListenerContainer: INFO

# Resilience4j 配置
resilience4j:
  circuitbreaker:
    instances:
      tradeService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        slowCallRateThreshold: 100
        slowCallDurationThreshold: 2s
  timelimiter:
    instances:
      tradeService:
        timeoutDuration: 3s

