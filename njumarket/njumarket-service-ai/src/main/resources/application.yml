# AI Service 本地配置（简化版）
# 详细配置已迁移到 Config Server: config-repo/njumarket-service-ai.yml
# 本地仅保留必要的服务标识和 Config Server 连接配置
# 如果 Config Server 不可用，会使用本地配置作为后备

server:
  port: 8098
  # 增加连接超时时间，支持 AI 对话等耗时操作
  connection-timeout: 120000  # 120 秒
  tomcat:
    connection-timeout: 120000  # 120 秒
    keep-alive-timeout: 120000  # 120 秒

spring:
  application:
    name: njumarket-service-ai
  cloud:
    config:
      # 本地开发默认不使用 Config Server（需要时可通过环境变量开启）
      enabled: ${CONFIG_SERVER_ENABLED:false}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:default}
      password: ${REDIS_PASSWORD:hqz20050316}
      database: ${AI_REDIS_DATABASE:3}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

njumarket:
  ai:
    milvus:
      enabled: ${MILVUS_ENABLED:true}
      uri: ${MILVUS_URI:http://localhost:19530}
      token: ${MILVUS_TOKEN:}
      db-name: ${MILVUS_DB_NAME:default}
      commodity-collection: ${MILVUS_COMMODITY_COLLECTION:commodity_vectors}
      user-profile-collection: ${MILVUS_USER_PROFILE_COLLECTION:user_profile_vectors}
      conversation-collection: ${MILVUS_CONVERSATION_COLLECTION:conversation_memory_vectors}
      dimension: ${MILVUS_DIMENSION:1024}
      top-k: ${MILVUS_TOP_K:10}
      metric-type: ${MILVUS_METRIC_TYPE:COSINE}
      memory-top-k: ${MILVUS_MEMORY_TOP_K:12}

