# AI Service 本地配置（简化版）
# 详细配置已迁移到 Config Server: config-repo/njumarket-service-ai.yml
# 本地仅保留必要的服务标识和 Config Server 连接配置
# 如果 Config Server 不可用，会使用本地配置作为后备

server:
  port: 8098
  # 增加连接超时时间，支持 AI 对话与 SSE（多轮工具调用期间可能长时间无输出）
  connection-timeout: 600000  # 10 分钟
  tomcat:
    connection-timeout: 600000
    keep-alive-timeout: 1800000  # 30 分钟，与网关 AI 路由下游超时对齐

spring:
  application:
    name: njumarket-service-ai
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${AUTH_DATASOURCE_URL:jdbc:postgresql://localhost:5432/njumarket?currentSchema=nju_market}
    username: ${AUTH_DATASOURCE_USERNAME:postgres}
    password: ${AUTH_DATASOURCE_PASSWORD:Hqz20050316}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  cloud:
    config:
      # 本地开发默认不使用 Config Server（需要时可通过环境变量开启）
      enabled: ${CONFIG_SERVER_ENABLED:false}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:default}
      password: ${REDIS_PASSWORD:hqz20050316}
      database: ${AI_REDIS_DATABASE:3}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

njumarket:
  ai:
    # 流式对话上游 HTTP 超时（秒），需覆盖多步工具调用
    streaming-http-timeout-seconds: ${AI_STREAMING_HTTP_TIMEOUT_SECONDS:600}
    milvus:
      enabled: ${MILVUS_ENABLED:true}
      uri: ${MILVUS_URI:http://localhost:19530}
      token: ${MILVUS_TOKEN:}
      db-name: ${MILVUS_DB_NAME:default}
      commodity-collection: ${MILVUS_COMMODITY_COLLECTION:commodity_vectors}
      user-profile-collection: ${MILVUS_USER_PROFILE_COLLECTION:user_profile_vectors}
      conversation-collection: ${MILVUS_CONVERSATION_COLLECTION:conversation_memory_vectors}
      dimension: ${MILVUS_DIMENSION:1024}
      top-k: ${MILVUS_TOP_K:10}
      metric-type: ${MILVUS_METRIC_TYPE:COSINE}
      memory-top-k: ${MILVUS_MEMORY_TOP_K:12}

