# Admin Service 本地配置（简化版）
# 详细配置已迁移到 Config Server: config-repo/njumarket-service-admin.yml
# 本地仅保留必要的服务标识和 Config Server 连接配置

server:
  port: 8096

spring:
  application:
    name: njumarket-service-admin
  cloud:
    config:
      enabled: ${CONFIG_SERVER_ENABLED:false}

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${ADMIN_DATASOURCE_URL:jdbc:postgresql://localhost:5432/njumarket?currentSchema=nju_market}
    username: ${ADMIN_DATASOURCE_USERNAME:postgres}
    password: ${ADMIN_DATASOURCE_PASSWORD:Hqz20050316}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:default}
      password: ${REDIS_PASSWORD:hqz20050316}
      database: ${ADMIN_REDIS_DATABASE:6}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

njumarket:
  admin:
    cookie:
      same-site: Strict
      secure: false
      path: /

