server:
  port: 8096

spring:
  application:
    name: njumarket-service-admin
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${ADMIN_DATASOURCE_URL:jdbc:mysql://localhost:3306/nju_market?useSSL=false&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
    username: ${ADMIN_DATASOURCE_USERNAME:root}
    password: ${ADMIN_DATASOURCE_PASSWORD:Hqz20050316}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:hqz20050316}
      database: ${ADMIN_REDIS_DATABASE:2}  # 统一使用db2作为缓存数据库

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

# Feign Client 配置
feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 10000
      njumarket-service-auth:
        connectTimeout: 3000
        readTimeout: 5000
      njumarket-service-commodity:
        connectTimeout: 3000
        readTimeout: 5000
      njumarket-service-order:
        connectTimeout: 3000
        readTimeout: 5000
      njumarket-service-message:
        connectTimeout: 3000
        readTimeout: 5000
  compression:
    request:
      enabled: true
    response:
      enabled: true

# Actuator 配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true

  logging:
    level:
      com.njumarket.admin.client: DEBUG

