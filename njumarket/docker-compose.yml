version: '3.8'

services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: njumarket-mysql
    environment:
      MYSQL_ROOT_PASSWORD: Hqz20050316
      MYSQL_DATABASE: nju_market
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # 暂时注释掉 schema.sql，因为文件编码问题导致初始化失败
      # 启动后可以手动导入：docker exec -i njumarket-mysql mysql -uroot -pHqz20050316 nju_market < database/schema.sql
      # - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pHqz20050316"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - njumarket-network

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: njumarket-redis
    command: redis-server --requirepass hqz20050316
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - njumarket-network

  # Eureka 服务注册中心
  discovery:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: njumarket-discovery
        SERVICE_PORT: 8761
    container_name: njumarket-discovery
    ports:
      - "8761:8761"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      # ✅ 设置字符编码环境变量（解决中文日志乱码问题）
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
      - JAVA_TOOL_OPTIONS=-Dfile.encoding=UTF-8 -Duser.timezone=Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - njumarket-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # Spring Cloud Config Server
  config-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: njumarket-config
        SERVICE_PORT: 8888
    container_name: njumarket-config-server
    ports:
      - "8888:8888"
    environment:
      # ✅ Config Server 必须使用 native profile 才能使用本地文件系统存储配置
      - SPRING_PROFILES_ACTIVE=native
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery:8761/eureka
      # ✅ 设置字符编码环境变量（解决中文日志乱码问题）
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
      - JAVA_TOOL_OPTIONS=-Dfile.encoding=UTF-8 -Duser.timezone=Asia/Shanghai
    depends_on:
      discovery:
        condition: service_healthy
    networks:
      - njumarket-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # API 网关
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: njumarket-gateway
        SERVICE_PORT: 8080
    container_name: njumarket-gateway
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=hqz20050316
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery:8761/eureka
      # ✅ 设置字符编码环境变量（解决中文日志乱码问题）
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
      - JAVA_TOOL_OPTIONS=-Dfile.encoding=UTF-8 -Duser.timezone=Asia/Shanghai
    depends_on:
      discovery:
        condition: service_healthy
      config-server:
        condition: service_healthy
      redis:
        condition: service_healthy
      zipkin:
        condition: service_healthy
    networks:
      - njumarket-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # 认证服务
  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: njumarket-service-auth
        SERVICE_PORT: 8091
    container_name: njumarket-service-auth
    ports:
      - "8091:8091"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - AUTH_DATASOURCE_URL=jdbc:mysql://mysql:3306/nju_market?useSSL=false&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      - AUTH_DATASOURCE_USERNAME=root
      - AUTH_DATASOURCE_PASSWORD=Hqz20050316
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=hqz20050316
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery:8761/eureka
      # ✅ 设置字符编码环境变量（解决中文日志乱码问题）
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
      - JAVA_TOOL_OPTIONS=-Dfile.encoding=UTF-8 -Duser.timezone=Asia/Shanghai
    depends_on:
      discovery:
        condition: service_healthy
      config-server:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      zipkin:
        condition: service_healthy
    networks:
      - njumarket-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8091/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # 商品服务
  commodity-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: njumarket-service-commodity
        SERVICE_PORT: 8092
    container_name: njumarket-service-commodity
    ports:
      - "8092:8092"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - COMMODITY_DATASOURCE_URL=jdbc:mysql://mysql:3306/nju_market?useSSL=false&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      - COMMODITY_DATASOURCE_USERNAME=root
      - COMMODITY_DATASOURCE_PASSWORD=Hqz20050316
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=hqz20050316
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery:8761/eureka
      # ✅ 设置字符编码环境变量（解决中文日志乱码问题）
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
      - JAVA_TOOL_OPTIONS=-Dfile.encoding=UTF-8 -Duser.timezone=Asia/Shanghai
    depends_on:
      discovery:
        condition: service_healthy
      config-server:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      zipkin:
        condition: service_healthy
    networks:
      - njumarket-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8092/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # 订单服务
  order-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: njumarket-service-order
        SERVICE_PORT: 8093
    container_name: njumarket-service-order
    ports:
      - "8093:8093"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - ORDER_DATASOURCE_URL=jdbc:mysql://mysql:3306/nju_market?useSSL=false&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      - ORDER_DATASOURCE_USERNAME=root
      - ORDER_DATASOURCE_PASSWORD=Hqz20050316
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=hqz20050316
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery:8761/eureka
      # ✅ 设置字符编码环境变量（解决中文日志乱码问题）
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
      - JAVA_TOOL_OPTIONS=-Dfile.encoding=UTF-8 -Duser.timezone=Asia/Shanghai
    depends_on:
      discovery:
        condition: service_healthy
      config-server:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      zipkin:
        condition: service_healthy
    networks:
      - njumarket-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8093/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # 消息服务
  message-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: njumarket-service-message
        SERVICE_PORT: 8094
    container_name: njumarket-service-message
    ports:
      - "8094:8094"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - MESSAGE_DATASOURCE_URL=jdbc:mysql://mysql:3306/nju_market?useSSL=false&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      - MESSAGE_DATASOURCE_USERNAME=root
      - MESSAGE_DATASOURCE_PASSWORD=Hqz20050316
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=hqz20050316
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery:8761/eureka
      # ✅ 设置字符编码环境变量（解决中文日志乱码问题）
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
      - JAVA_TOOL_OPTIONS=-Dfile.encoding=UTF-8 -Duser.timezone=Asia/Shanghai
    depends_on:
      discovery:
        condition: service_healthy
      config-server:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      zipkin:
        condition: service_healthy
    networks:
      - njumarket-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8094/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # 图片服务
  image-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: njumarket-service-image
        SERVICE_PORT: 8095
    container_name: njumarket-service-image
    ports:
      - "8095:8095"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - IMAGE_DATASOURCE_URL=jdbc:mysql://mysql:3306/nju_market?useSSL=false&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      - IMAGE_DATASOURCE_USERNAME=root
      - IMAGE_DATASOURCE_PASSWORD=Hqz20050316
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery:8761/eureka
      # ✅ 设置字符编码环境变量（解决中文日志乱码问题）
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
      - JAVA_TOOL_OPTIONS=-Dfile.encoding=UTF-8 -Duser.timezone=Asia/Shanghai
    depends_on:
      discovery:
        condition: service_healthy
      config-server:
        condition: service_healthy
      mysql:
        condition: service_healthy
      zipkin:
        condition: service_healthy
    volumes:
      # 挂载本地 uploads 目录到容器，实现数据持久化
      # uploads 目录和后端、前端同级，在 njumarket 的上一级目录
      # 本地路径：../uploads -> 容器路径：/app/uploads
      - ../uploads:/app/uploads
    networks:
      - njumarket-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8095/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # 管理服务
  admin-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: njumarket-service-admin
        SERVICE_PORT: 8096
    container_name: njumarket-service-admin
    ports:
      - "8096:8096"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - ADMIN_DATASOURCE_URL=jdbc:mysql://mysql:3306/nju_market?useSSL=false&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      - ADMIN_DATASOURCE_USERNAME=root
      - ADMIN_DATASOURCE_PASSWORD=Hqz20050316
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=hqz20050316
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery:8761/eureka
      # ✅ 设置字符编码环境变量（解决中文日志乱码问题）
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
      - JAVA_TOOL_OPTIONS=-Dfile.encoding=UTF-8 -Duser.timezone=Asia/Shanghai
    depends_on:
      discovery:
        condition: service_healthy
      config-server:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      zipkin:
        condition: service_healthy
    networks:
      - njumarket-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8096/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # 通知服务
  notification-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: njumarket-service-notification
        SERVICE_PORT: 8097
    container_name: njumarket-service-notification
    ports:
      - "8097:8097"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=hqz20050316
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery:8761/eureka
      # ✅ 设置字符编码环境变量（解决中文日志乱码问题）
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
      - JAVA_TOOL_OPTIONS=-Dfile.encoding=UTF-8 -Duser.timezone=Asia/Shanghai
    depends_on:
      discovery:
        condition: service_healthy
      config-server:
        condition: service_healthy
      redis:
        condition: service_healthy
      zipkin:
        condition: service_healthy
    networks:
      - njumarket-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8097/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Zipkin 分布式链路追踪服务
  zipkin:
    image: openzipkin/zipkin:latest
    container_name: njumarket-zipkin
    ports:
      - "9411:9411"
    environment:
      - STORAGE_TYPE=mem  # 使用内存存储（生产环境建议使用 Elasticsearch 或 MySQL）
    networks:
      - njumarket-network
    # Zipkin 健康检查：检查 HTTP 端点
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:9411/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  # Prometheus 监控服务
  prometheus:
    image: prom/prometheus:latest
    container_name: njumarket-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - njumarket-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      - gateway
      - discovery
      - config-server

  # Grafana 可视化服务
  grafana:
    image: grafana/grafana:latest
    container_name: njumarket-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - njumarket-network
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      - prometheus

  # RabbitMQ 消息队列服务
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: njumarket-rabbitmq
    ports:
      - "5672:5672"      # AMQP 端口
      - "15672:15672"    # 管理界面端口
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=admin
      - RABBITMQ_DEFAULT_VHOST=/
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - njumarket-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  mysql_data:
  redis_data:
  prometheus_data:
  grafana_data:
  rabbitmq_data:

networks:
  njumarket-network:
    driver: bridge

