services:
  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: njumarket-redis
    command: redis-server --requirepass hqz20050316
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - njumarket-network

  # Eureka 服务注册中心
  discovery:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: njumarket-discovery
        SERVICE_PORT: 8761
    container_name: njumarket-discovery
    ports:
      - "8761:8761"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      # ✅ 设置字符编码环境变量（解决中文日志乱码问题）
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
      - JAVA_TOOL_OPTIONS=-Dfile.encoding=UTF-8 -Duser.timezone=Asia/Shanghai
    networks:
      - njumarket-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # Spring Cloud Config Server
  config-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: njumarket-config
        SERVICE_PORT: 8888
    container_name: njumarket-config-server
    ports:
      - "8888:8888"
    environment:
      # ✅ Config Server 必须使用 native profile 才能使用本地文件系统存储配置
      - SPRING_PROFILES_ACTIVE=native
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery:8761/eureka
      # ✅ 设置字符编码环境变量（解决中文日志乱码问题）
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
      - JAVA_TOOL_OPTIONS=-Dfile.encoding=UTF-8 -Duser.timezone=Asia/Shanghai
    depends_on:
      discovery:
        condition: service_healthy
    networks:
      - njumarket-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # API 网关
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: njumarket-gateway
        SERVICE_PORT: 8080
    container_name: njumarket-gateway
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=hqz20050316
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery:8761/eureka
      # ✅ 设置字符编码环境变量（解决中文日志乱码问题）
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
      - JAVA_TOOL_OPTIONS=-Dfile.encoding=UTF-8 -Duser.timezone=Asia/Shanghai
    depends_on:
      discovery:
        condition: service_healthy
      config-server:
        condition: service_healthy
      redis:
        condition: service_healthy
      zipkin:
        condition: service_healthy
    networks:
      - njumarket-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # 认证服务
  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: njumarket-service-auth
        SERVICE_PORT: 8091
    container_name: njumarket-service-auth
    ports:
      - "8091:8091"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - AUTH_DATASOURCE_URL=jdbc:postgresql://postgres:5432/njumarket?currentSchema=nju_market
      - AUTH_DATASOURCE_USERNAME=postgres
      - AUTH_DATASOURCE_PASSWORD=Hqz20050316
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=hqz20050316
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery:8761/eureka
      # ✅ 设置字符编码环境变量（解决中文日志乱码问题）
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
      - JAVA_TOOL_OPTIONS=-Dfile.encoding=UTF-8 -Duser.timezone=Asia/Shanghai
    depends_on:
      discovery:
        condition: service_healthy
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      zipkin:
        condition: service_healthy
    networks:
      - njumarket-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8091/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # 商品服务
  commodity-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: njumarket-service-commodity
        SERVICE_PORT: 8092
    container_name: njumarket-service-commodity
    ports:
      - "8092:8092"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - COMMODITY_DATASOURCE_URL=jdbc:postgresql://postgres:5432/njumarket?currentSchema=nju_market
      - COMMODITY_DATASOURCE_USERNAME=postgres
      - COMMODITY_DATASOURCE_PASSWORD=Hqz20050316
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=hqz20050316
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery:8761/eureka
      # ✅ 设置字符编码环境变量（解决中文日志乱码问题）
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
      - JAVA_TOOL_OPTIONS=-Dfile.encoding=UTF-8 -Duser.timezone=Asia/Shanghai
    depends_on:
      discovery:
        condition: service_healthy
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      zipkin:
        condition: service_healthy
    networks:
      - njumarket-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8092/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # 订单服务
  order-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: njumarket-service-order
        SERVICE_PORT: 8093
    container_name: njumarket-service-order
    ports:
      - "8093:8093"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - ORDER_DATASOURCE_URL=jdbc:postgresql://postgres:5432/njumarket?currentSchema=nju_market
      - ORDER_DATASOURCE_USERNAME=postgres
      - ORDER_DATASOURCE_PASSWORD=Hqz20050316
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=hqz20050316
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery:8761/eureka
      # ✅ 设置字符编码环境变量（解决中文日志乱码问题）
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
      - JAVA_TOOL_OPTIONS=-Dfile.encoding=UTF-8 -Duser.timezone=Asia/Shanghai
    depends_on:
      discovery:
        condition: service_healthy
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      zipkin:
        condition: service_healthy
    networks:
      - njumarket-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8093/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # 消息服务
  message-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: njumarket-service-message
        SERVICE_PORT: 8094
    container_name: njumarket-service-message
    ports:
      - "8094:8094"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - MESSAGE_DATASOURCE_URL=jdbc:postgresql://postgres:5432/njumarket?currentSchema=nju_market
      - MESSAGE_DATASOURCE_USERNAME=postgres
      - MESSAGE_DATASOURCE_PASSWORD=Hqz20050316
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=hqz20050316
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery:8761/eureka
      # ✅ 设置字符编码环境变量（解决中文日志乱码问题）
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
      - JAVA_TOOL_OPTIONS=-Dfile.encoding=UTF-8 -Duser.timezone=Asia/Shanghai
    depends_on:
      discovery:
        condition: service_healthy
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      zipkin:
        condition: service_healthy
    networks:
      - njumarket-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8094/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # 图片服务
  image-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: njumarket-service-image
        SERVICE_PORT: 8095
    container_name: njumarket-service-image
    ports:
      - "8095:8095"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - IMAGE_DATASOURCE_URL=jdbc:postgresql://postgres:5432/njumarket?currentSchema=nju_market
      - IMAGE_DATASOURCE_USERNAME=postgres
      - IMAGE_DATASOURCE_PASSWORD=Hqz20050316
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery:8761/eureka
      # ✅ 设置字符编码环境变量（解决中文日志乱码问题）
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
      - JAVA_TOOL_OPTIONS=-Dfile.encoding=UTF-8 -Duser.timezone=Asia/Shanghai
    depends_on:
      discovery:
        condition: service_healthy
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      zipkin:
        condition: service_healthy
    volumes:
      # 挂载本地 uploads 目录到容器，实现数据持久化
      # uploads 目录和后端、前端同级，在 njumarket 的上一级目录
      # 本地路径：../uploads -> 容器路径：/app/uploads
      - ../uploads:/app/uploads
    networks:
      - njumarket-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8095/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # 管理服务
  admin-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: njumarket-service-admin
        SERVICE_PORT: 8096
    container_name: njumarket-service-admin
    ports:
      - "8096:8096"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - ADMIN_DATASOURCE_URL=jdbc:postgresql://postgres:5432/njumarket?currentSchema=nju_market
      - ADMIN_DATASOURCE_USERNAME=postgres
      - ADMIN_DATASOURCE_PASSWORD=Hqz20050316
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=hqz20050316
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery:8761/eureka
      # ✅ 设置字符编码环境变量（解决中文日志乱码问题）
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
      - JAVA_TOOL_OPTIONS=-Dfile.encoding=UTF-8 -Duser.timezone=Asia/Shanghai
    depends_on:
      discovery:
        condition: service_healthy
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      zipkin:
        condition: service_healthy
    networks:
      - njumarket-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8096/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # 通知服务
  notification-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: njumarket-service-notification
        SERVICE_PORT: 8097
    container_name: njumarket-service-notification
    ports:
      - "8097:8097"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=hqz20050316
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery:8761/eureka
      # ✅ 设置字符编码环境变量（解决中文日志乱码问题）
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
      - JAVA_TOOL_OPTIONS=-Dfile.encoding=UTF-8 -Duser.timezone=Asia/Shanghai
    depends_on:
      discovery:
        condition: service_healthy
      config-server:
        condition: service_healthy
      redis:
        condition: service_healthy
      zipkin:
        condition: service_healthy
    networks:
      - njumarket-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8097/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Zipkin 分布式链路追踪服务
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: njumarket-elasticsearch
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms1g -Xmx1g -Des.insecure_network_trace_enabled=true
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
      - es_logs:/usr/share/elasticsearch/logs
    networks:
      - njumarket-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  zipkin:
    image: openzipkin/zipkin:latest
    container_name: njumarket-zipkin
    ports:
      - "9411:9411"
    environment:
      - STORAGE_TYPE=mem  # 使用内存存储（生产环境建议使用 Elasticsearch 或 MySQL）
    networks:
      - njumarket-network
    # Zipkin 健康检查：检查 HTTP 端点
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:9411/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  # Prometheus 监控服务
  prometheus:
    image: prom/prometheus:latest
    container_name: njumarket-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - njumarket-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      - gateway
      - discovery
      - config-server

  # Grafana 可视化服务
  grafana:
    image: grafana/grafana:latest
    container_name: njumarket-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - njumarket-network
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      - prometheus

  # RabbitMQ 消息队列服务
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: njumarket-rabbitmq
    ports:
      - "5672:5672"      # AMQP 端口
      - "15672:15672"    # 管理界面端口
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=admin
      - RABBITMQ_DEFAULT_VHOST=/
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - njumarket-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # PostgreSQL 数据库
  # 注意：PostgreSQL 18 的 PostGIS 镜像尚未发布，暂时使用 PostgreSQL 16
  # 如需使用 PostgreSQL 18，可以使用 postgres:18 镜像，但需要手动安装 PostGIS
  postgres:
    # 使用 postgis/postgis 镜像（包含 PostGIS 扩展）
    # PostgreSQL 16-3.4 已验证可用，功能完全满足需求
    image: postgis/postgis:16-3.4
    container_name: njumarket-postgres
    environment:
      POSTGRES_DB: njumarket
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Hqz20050316
      # PostgreSQL 数据目录路径
      # PostgreSQL 16 使用标准路径，18 需要使用 /var/lib/postgresql/data/pgdata
      PGDATA: /var/lib/postgresql/data
      # 启用 pg_stat_statements
      # 注意：Docker 镜像可能不支持 zh_CN.UTF-8，使用 C.UTF-8 或 en_US.UTF-8
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C.UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # 初始化脚本：自动启用扩展（已注释，数据已导入，避免重复执行）
      # - ./database/postgres-init.sql:/docker-entrypoint-initdb.d/01-init-extensions.sql:ro
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
      - "-c"
      - "pg_stat_statements.track=all"
      - "-c"
      - "pg_stat_statements.max=10000"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "effective_cache_size=1GB"
      - "-c"
      - "maintenance_work_mem=64MB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "wal_buffers=16MB"
      - "-c"
      - "default_statistics_target=100"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "work_mem=4MB"
      - "-c"
      - "min_wal_size=1GB"
      - "-c"
      - "max_wal_size=4GB"
      - "-c"
      - "timezone=Asia/Shanghai"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d njumarket"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - njumarket-network

volumes:
  redis_data:
  prometheus_data:
  grafana_data:
  rabbitmq_data:
  postgres_data:
  es_data:
  es_logs:

networks:
  njumarket-network:
    driver: bridge

