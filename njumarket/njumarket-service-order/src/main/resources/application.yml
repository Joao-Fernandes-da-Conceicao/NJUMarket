# Order Service 本地配置（简化版）
# 详细配置已迁移到 Config Server: config-repo/njumarket-service-order.yml
# 本地仅保留必要的服务标识和 Config Server 连接配置

server:
  port: 8093

spring:
  application:
    name: njumarket-service-order
  cloud:
    config:
      enabled: ${CONFIG_SERVER_ENABLED:false}

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${ORDER_DATASOURCE_URL:jdbc:postgresql://localhost:5432/njumarket?currentSchema=nju_market}
    username: ${ORDER_DATASOURCE_USERNAME:postgres}
    password: ${ORDER_DATASOURCE_PASSWORD:Hqz20050316}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:default}
      password: ${REDIS_PASSWORD:hqz20050316}
      database: ${ORDER_REDIS_DATABASE:4}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:admin}
    password: ${RABBITMQ_PASSWORD:admin}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

