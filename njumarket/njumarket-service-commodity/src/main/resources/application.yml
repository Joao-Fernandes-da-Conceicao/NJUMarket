# Commodity Service 本地配置（简化版）
# 详细配置已迁移到 Config Server: config-repo/njumarket-service-commodity.yml
# 本地仅保留必要的服务标识和 Config Server 连接配置
# 如果 Config Server 不可用，会使用本地配置作为后备

server:
  port: 8092
  # 增加连接超时时间，支持 AI 搜索等耗时操作
  connection-timeout: 60000  # 60 秒
  tomcat:
    connection-timeout: 60000  # 60 秒
    keep-alive-timeout: 60000  # 60 秒

spring:
  application:
    name: njumarket-service-commodity
  # ✅ Spring Cloud Config Client 配置
  # Docker 环境通过环境变量 SPRING_CONFIG_IMPORT 覆盖，本地开发使用 localhost
  config:
    import: ${SPRING_CONFIG_IMPORT:optional:configserver:http://localhost:8888}
    fail-fast: false  # Config Server 不可用时，使用本地配置
  # 本地数据源配置（作为 Config Server 不可用时的后备）
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${COMMODITY_DATASOURCE_URL:jdbc:postgresql://localhost:5432/njumarket?currentSchema=nju_market}
    username: ${COMMODITY_DATASOURCE_USERNAME:postgres}
    password: ${COMMODITY_DATASOURCE_PASSWORD:Hqz20050316}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:hqz20050316}
      database: ${COMMODITY_REDIS_DATABASE:2}
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}
    username: ${ELASTICSEARCH_USERNAME:elastic}
    password: ${ELASTICSEARCH_PASSWORD:changeme}

commodity:
  search:
    enabled: ${COMMODITY_SEARCH_ENABLED:true}
    elasticsearch:
      enabled: ${COMMODITY_SEARCH_ES_ENABLED:true}
      highlight-enabled: ${COMMODITY_SEARCH_HIGHLIGHT:true}
      index: ${COMMODITY_SEARCH_INDEX:commodities}
    sync:
      auto-reindex-on-startup: ${COMMODITY_SEARCH_AUTO_REINDEX:false}
      page-size: ${COMMODITY_SEARCH_SYNC_PAGE_SIZE:500}

